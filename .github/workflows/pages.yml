name: Sync GEP website to gh-pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gep-pages-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Validate marketing site
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/assets/gep-mark.svg
          python - <<'PY'
          from pathlib import Path
          html=Path("site/index.html").read_text()
          assert '<title>' in html and 'href="styles.css?v=' in html
          assert 'v0.1.0-alpha.1' in html
          assert "当前没有对公众开放的托管 MOVA 服务" in html
          PY
      - name: Sync site files to gh-pages branch
        run: |
          mkdir -p "$RUNNER_TEMP/gep-site"
          cp -R site/. "$RUNNER_TEMP/gep-site/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/gep-site/." .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy: sync product website from main"
            git push origin HEAD:gh-pages
          fi

# One-time repository owner action:
# Settings -> Pages -> Build and deployment -> Deploy from a branch
# Branch: gh-pages / (root), Save.
