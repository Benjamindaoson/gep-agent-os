name: GEP Core CI
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

      - run: python -m compileall -q src/gep
      - run: gep --help
      - run: gep --db ci-demo.sqlite demo-init
      - run: gep --db ci-demo.sqlite workflows
      
  cloud:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./gep_cloud_ci.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cloud/requirements.txt
      - run: python -m unittest discover -s cloud/tests -v
      - run: python -m compileall -q cloud
