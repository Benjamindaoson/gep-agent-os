name: GEP Core CI
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

      - run: python -m compileall -q src/gep
      - run: gep --help
      - run: gep --db ci-demo.sqlite demo-init
      - run: gep --db ci-demo.sqlite workflows
      
  cloud:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./gep_cloud_ci.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cloud/requirements.txt
      - run: python -m unittest discover -s cloud/tests -v
      - run: python -m compileall -q cloud

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gep-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
