name: GEP Core CI
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

      - run: python -m compileall -q src/gep
      - run: gep --help
      - run: gep --db ci-demo.sqlite demo-init
      - run: gep --db ci-demo.sqlite workflows
