name: Publish GEP prerelease
on:
  push:
    branches: [main]
    paths:
      - 'release/VERSION'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gep-release
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  cloud:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./gep_cloud_release.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cloud/requirements.txt
      - run: python -m unittest discover -s cloud/tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s desktop/tests -v
      - name: Build Windows portable executable
        run: >
          python -m PyInstaller --onefile --windowed
          --name GEP-Companion-Windows-x64
          --collect-all keyring
          desktop/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/GEP-Companion-Windows-x64.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android :app:assembleDebug --no-daemon
      - name: Collect debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GEP-Companion-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: GEP-Companion-Android-debug.apk
          if-no-files-found: error

  publish:
    needs: [core, cloud, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Determine and validate version
        id: version
        run: |
          VERSION=$(cat release/VERSION | tr -d '\r\n')
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || exit 1
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing overwrite"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets
      - name: Validate release assets
        run: |
          test -s release-assets/GEP-Companion-Windows-x64.exe
          test -s release-assets/GEP-Companion-Android-debug.apk
          cd release-assets && sha256sum * > SHA256SUMS.txt
      - name: Publish tagged prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            release-assets/GEP-Companion-Windows-x64.exe \
            release-assets/GEP-Companion-Android-debug.apk \
            release-assets/SHA256SUMS.txt \
            --title "GEP Agent OS $TAG — Experimental Companions" \
            --notes-file release/RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --prerelease \
            --verify-tag=false
